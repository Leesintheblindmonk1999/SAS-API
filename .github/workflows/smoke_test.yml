name: SAS API Smoke Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "requirements.txt"
jobs:
  smoke-test:
    name: Production API Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SAS_BASE_URL: https://sas-api.onrender.com
      SAS_API_KEY: ${{ secrets.SAS_SMOKE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show target
        run: |
          echo "Testing SAS API at: $SAS_BASE_URL"
      - name: Wait for API to wake up
        run: |
          set -e
          echo "Waking up API..."
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$SAS_BASE_URL/health" || true)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo ""
              echo "API is awake."
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time."
          cat /tmp/health.json || true
          exit 1
      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting for Render deployment to stabilize..."
          sleep 45
      - name: Check /health
        run: |
          set -e
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$SAS_BASE_URL/health" || true)
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
          cat /tmp/health.json | jq .
          status=$(cat /tmp/health.json | jq -r '.status')
          kappa=$(cat /tmp/health.json | jq -r '.kappa_d')
          test "$status" = "ok"
          test "$kappa" != "null"
      - name: Check /readyz
        run: |
          set -e
          code=$(curl -sS -o /tmp/readyz.json -w "%{http_code}" "$SAS_BASE_URL/readyz" || true)
          echo "HTTP $code"
          cat /tmp/readyz.json || true
          test "$code" = "200"
          cat /tmp/readyz.json | jq .
          status=$(cat /tmp/readyz.json | jq -r '.status')
          test "$status" = "ready"
          cat /tmp/readyz.json | jq -e '.routers.public_demo == true'
          cat /tmp/readyz.json | jq -e '.routers.public_request_key == true'
          cat /tmp/readyz.json | jq -e '.routers.whoami == true'
          cat /tmp/readyz.json | jq -e '.routers.billing_polar == true'
          cat /tmp/readyz.json | jq -e '.routers.billing_mercadopago == true'
          cat /tmp/readyz.json | jq -e '.routers.diff == true'
          cat /tmp/readyz.json | jq -e '.routers.audit == true'
          cat /tmp/readyz.json | jq -e '.routers.batch == true'
          cat /tmp/readyz.json | jq -e '.routers.public_interaction_stats == true'
          cat /tmp/readyz.json | jq -e '.routers.interaction_stability == true'
          cat /tmp/readyz.json | jq -e '.databases.auth_db == true'
          cat /tmp/readyz.json | jq -e '.databases.metrics_db == true'
          cat /tmp/readyz.json | jq -e '.databases.audit_db == true'
          cat /tmp/readyz.json | jq -e '.databases.rate_limit_db == true'
          cat /tmp/readyz.json | jq -e '.databases.interaction_db == true'
      - name: Check /robots.txt
        run: |
          set -e
          code=$(curl -sS -o /tmp/robots.txt -w "%{http_code}" "$SAS_BASE_URL/robots.txt" || true)
          echo "HTTP $code"
          cat /tmp/robots.txt
          test "$code" = "200"
          grep -q "User-agent: \*" /tmp/robots.txt
          grep -q "Disallow: /public/request-key" /tmp/robots.txt
      - name: Check HEAD /
        run: |
          set -e
          code=$(curl -sS -I -o /tmp/head.txt -w "%{http_code}" "$SAS_BASE_URL/" || true)
          echo "HTTP $code"
          cat /tmp/head.txt
          test "$code" = "200"
      - name: Check public stats
        run: |
          set -e
          code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" "$SAS_BASE_URL/public/stats" || true)
          echo "HTTP $code"
          cat /tmp/stats.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/stats.json | jq -r '.status')
          test "$status" = "ok"
          cat /tmp/stats.json | jq -e '.privacy.raw_ips_exposed == false'
          cat /tmp/stats.json | jq -e '.privacy.api_keys_exposed == false'
      - name: Check public interaction stats
        run: |
          set -e
          code=$(curl -sS -o /tmp/interaction_stats.json -w "%{http_code}" "$SAS_BASE_URL/public/interaction/stats?days=7" || true)
          echo "HTTP $code"
          cat /tmp/interaction_stats.json || true
          test "$code" = "200"
          cat /tmp/interaction_stats.json | jq .
          status=$(cat /tmp/interaction_stats.json | jq -r '.status')
          test "$status" = "ok"
          cat /tmp/interaction_stats.json | jq -e '.period != null'
          cat /tmp/interaction_stats.json | jq -e '.total_analyses != null'
          cat /tmp/interaction_stats.json | jq -e '.privacy.raw_text_stored == false'
          cat /tmp/interaction_stats.json | jq -e '.privacy.raw_api_keys_stored == false'
          cat /tmp/interaction_stats.json | jq -e '.privacy.public_stats_are_aggregated == true'

      - name: Check /v2/audit (tribunal endpoint)
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          code=$(curl -sS -o /tmp/tribunal.json -w "%{http_code}" -X POST "$SAS_BASE_URL/v2/audit" -H "Content-Type: application/json" -H "X-API-Key: $SAS_API_KEY" -d '{"source":"The Eiffel Tower is in Paris, France.","response":"The Eiffel Tower is in Berlin, Germany."}' || true)
          echo "HTTP $code"
          cat /tmp/tribunal.json || true
          test "$code" = "200"
          cat /tmp/tribunal.json | jq -e '.status == "ok"'
          cat /tmp/tribunal.json | jq -e '.zona != null'
          cat /tmp/tribunal.json | jq -e '.isi_final != null'
          cat /tmp/tribunal.json | jq -e '.kappa_d == 0.56'
          cat /tmp/tribunal.json | jq -e '.codigo_zona != null'

      - name: Check public activity
        run: |
          set -e
          code=$(curl -sS -o /tmp/activity.json -w "%{http_code}" "$SAS_BASE_URL/public/activity?limit=5" || true)
          echo "HTTP $code"
          cat /tmp/activity.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/activity.json | jq -r '.status')
          test "$status" = "ok"
      - name: Check public request-key GET onboarding
        run: |
          set -e
          code=$(curl -sS -o /tmp/request_key_help.json -w "%{http_code}" "$SAS_BASE_URL/public/request-key" || true)
          echo "HTTP $code"
          cat /tmp/request_key_help.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/request_key_help.json | jq -r '.status')
          message=$(cat /tmp/request_key_help.json | jq -r '.message')
          cli=$(cat /tmp/request_key_help.json | jq -r '.recommended.cli.command')
          test "$status" = "info"
          echo "$message" | grep -q "POST /public/request-key"
          echo "$cli" | grep -q "sas request-key"
      - name: Check public demo GET onboarding
        run: |
          set -e
          code=$(curl -sS -o /tmp/demo_help.json -w "%{http_code}" "$SAS_BASE_URL/public/demo/audit" || true)
          echo "HTTP $code"
          cat /tmp/demo_help.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/demo_help.json | jq -r '.status')
          message=$(cat /tmp/demo_help.json | jq -r '.message')
          cli=$(cat /tmp/demo_help.json | jq -r '.recommended.cli.command')
          test "$status" = "info"
          echo "$message" | grep -q "POST /public/demo/audit"
          echo "$cli" | grep -q "sas demo-audit"
      - name: Check public demo POST endpoint
        run: |
          set -e
          payload='{
            "source": "The Eiffel Tower is located in Paris, France, and was built in 1889.",
            "response": "The Eiffel Tower is located in Berlin, Germany, and was built in 1950."
          }'
          code=$(curl -sS -o /tmp/demo.json -w "%{http_code}" -X POST "$SAS_BASE_URL/public/demo/audit" \
            -H "Content-Type: application/json" \
            -d "$payload" || true)
          echo "HTTP $code"
          cat /tmp/demo.json | jq .
          if [ "$code" = "429" ]; then
            echo "::warning::Public demo endpoint is rate-limited. Skipping strict demo assertion."
            exit 0
          fi
          test "$code" = "200"
          status=$(cat /tmp/demo.json | jq -r '.status')
          isi=$(cat /tmp/demo.json | jq -r '.isi')
          verdict=$(cat /tmp/demo.json | jq -r '.verdict')
          test "$status" = "ok"
          test "$isi" != "null"
          test "$verdict" != "null"
      - name: Check public request-key validation error
        run: |
          set -e
          code=$(curl -sS -o /tmp/validation.json -w "%{http_code}" -X POST "$SAS_BASE_URL/public/request-key" \
            -H "Content-Type: application/json" \
            -d '{}' || true)
          echo "HTTP $code"
          cat /tmp/validation.json | jq .
          test "$code" = "422"
          error=$(cat /tmp/validation.json | jq -r '.error')
          reason=$(cat /tmp/validation.json | jq -r '.reason')
          missing_email=$(cat /tmp/validation.json | jq -r '.missing_fields | index("email") != null')
          required_email=$(cat /tmp/validation.json | jq -r '.required_format.email')
          cli_fix=$(cat /tmp/validation.json | jq -r '.fix.cli')
          test "$error" = "Validation error"
          test "$reason" = "missing_email"
          test "$missing_email" = "true"
          echo "$required_email" | grep -q "required"
          echo "$cli_fix" | grep -q "sas request-key"
      - name: Check public request-key invalid email
        run: |
          set -e
          code=$(curl -sS -o /tmp/invalid_email.json -w "%{http_code}" -X POST "$SAS_BASE_URL/public/request-key" \
            -H "Content-Type: application/json" \
            -d '{"email":"bad-email","name":"Smoke Test"}' || true)
          echo "HTTP $code"
          cat /tmp/invalid_email.json | jq .
          test "$code" = "422"
          error=$(cat /tmp/invalid_email.json | jq -r '.error')
          reason=$(cat /tmp/invalid_email.json | jq -r '.reason')
          invalid_email=$(cat /tmp/invalid_email.json | jq -r '.invalid_fields | index("email") != null')
          test "$error" = "Validation error"
          test "$reason" = "invalid_email"
          test "$invalid_email" = "true"
      - name: Check public request-key query email guidance
        run: |
          set -e
          code=$(curl -sS -o /tmp/query_email.json -w "%{http_code}" -X POST "$SAS_BASE_URL/public/request-key?email=test@example.com" || true)
          echo "HTTP $code"
          cat /tmp/query_email.json | jq .
          test "$code" = "400"
          reason=$(cat /tmp/query_email.json | jq -r '.reason')
          cli_fix=$(cat /tmp/query_email.json | jq -r '.fix.cli')
          test "$reason" = "email_in_query"
          echo "$cli_fix" | grep -q "sas request-key"
      - name: Check protected /v1/whoami
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          code=$(curl -sS -o /tmp/whoami.json -w "%{http_code}" "$SAS_BASE_URL/v1/whoami" \
            -H "X-API-Key: $SAS_API_KEY" || true)
          echo "HTTP $code"
          cat /tmp/whoami.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/whoami.json | jq -r '.status')
          active=$(cat /tmp/whoami.json | jq -r '.active')
          plan=$(cat /tmp/whoami.json | jq -r '.plan')
          allowed=$(cat /tmp/whoami.json | jq -r '.quota_allowed // true')
          test "$status" = "ok"
          test "$active" = "true"
          test "$plan" != "null"
          test "$allowed" = "true"
      - name: Check protected /v1/diff SourceTargetGuard
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          payload='{
            "text_a": "The Eiffel Tower is located in Paris, France. It was built in 1889. It is one of the most recognized landmarks in France.",
            "text_b": "The Eiffel Tower is located in Berlin, Germany. It was built in 1950. It is one of the most recognized landmarks in Germany.",
            "experimental": true
          }'
          code=$(curl -sS -o /tmp/diff.json -w "%{http_code}" -X POST "$SAS_BASE_URL/v1/diff" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $SAS_API_KEY" \
            -d "$payload" || true)
          echo "HTTP $code"
          cat /tmp/diff.json | jq .
          test "$code" = "200"
          isi=$(cat /tmp/diff.json | jq -r '.isi')
          verdict=$(cat /tmp/diff.json | jq -r '.verdict')
          alert=$(cat /tmp/diff.json | jq -r '.manipulation_alert.triggered // false')
          sources=$(cat /tmp/diff.json | jq -r '.manipulation_alert.sources | join(",")')
          test "$isi" != "null"
          test "$verdict" = "MANIFOLD_RUPTURE"
          test "$alert" = "true"
          echo "$sources" | grep -q "SourceTargetGuard"
      - name: Check protected /v1/batch
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          payload='{
            "pairs": [
              {
                "source": "The Eiffel Tower is located in Paris, France, and was built in 1889.",
                "response": "The Eiffel Tower is located in Berlin, Germany, and was built in 1950."
              },
              {
                "source": "Water boils at 100 degrees Celsius at sea level.",
                "response": "Water boils at 100 degrees Celsius at sea level."
              }
            ],
            "experimental": true,
            "domain": "generic"
          }'
          code=$(curl -sS -o /tmp/batch.json -w "%{http_code}" -X POST "$SAS_BASE_URL/v1/batch" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $SAS_API_KEY" \
            -d "$payload" || true)
          echo "HTTP $code"
          cat /tmp/batch.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/batch.json | jq -r '.status')
          count=$(cat /tmp/batch.json | jq -r '.count')
          results_len=$(cat /tmp/batch.json | jq '.results | length')
          batch_flag=$(cat /tmp/batch.json | jq -r '.batch')
          idx0=$(cat /tmp/batch.json | jq -r '.results[0].index')
          idx1=$(cat /tmp/batch.json | jq -r '.results[1].index')
          if [ "$status" != "ok" ] && [ "$status" != "partial_error" ]; then
            echo "Unexpected batch status: $status"
            exit 1
          fi
          test "$count" = "2"
          test "$results_len" = "2"
          test "$batch_flag" = "true"
          test "$idx0" = "0"
          test "$idx1" = "1"
          item0_ok=$(cat /tmp/batch.json | jq -r '.results[0] | has("verdict") or has("error")')
          item1_ok=$(cat /tmp/batch.json | jq -r '.results[1] | has("verdict") or has("error")')
          test "$item0_ok" = "true"
          test "$item1_ok" = "true"
          echo "Batch smoke test passed."

      # ── Interaction Stability (experimental) ─────────────────────────────────
      - name: Check /v1/interaction/stability/example (public, no key)
        run: |
          set -e
          code=$(curl -sS -o /tmp/interaction_example.json -w "%{http_code}" \
            "$SAS_BASE_URL/v1/interaction/stability/example" || true)
          echo "HTTP $code"
          cat /tmp/interaction_example.json | jq .
          test "$code" = "200"
          doi=$(cat /tmp/interaction_example.json | jq -r '.theory_doi')
          gamma=$(cat /tmp/interaction_example.json | jq -r '.gamma')
          notice=$(cat /tmp/interaction_example.json | jq -r '.experimental_notice')
          test "$doi" = "10.5281/zenodo.20335612"
          test "$gamma" != "null"
          echo "$notice" | grep -qi "model constructs"

      - name: Check /v1/interaction/stability POST without key (expect 401/403)
        run: |
          set -e
          code=$(curl -sS -o /tmp/interaction_noauth.json -w "%{http_code}" \
            -X POST "$SAS_BASE_URL/v1/interaction/stability" \
            -H "Content-Type: application/json" \
            -d '{"conversation":[{"role":"user","content":"ok"},{"role":"assistant","content":"procesado"}]}' \
            || true)
          echo "HTTP $code"
          cat /tmp/interaction_noauth.json | jq . || true
          # Must never be 200. 401/403/422 are valid auth/schema blocks; 429 is valid if the limiter already tripped.
          if [ "$code" = "200" ]; then
            echo "ERROR: POST without key returned 200. Auth is broken."
            exit 1
          fi
          case "$code" in
            401|403|422|429) echo "Auth/rate-limit check passed (HTTP $code)" ;;
            *) echo "Unexpected non-200 status for unauthenticated interaction POST: $code"; exit 1 ;;
          esac

      - name: Check /v1/interaction/stability POST with key (expect 200)
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          payload='{
            "conversation": [
              {"role":"user","content":"Necesito esto urgente, es para ayer."},
              {"role":"assistant","content":"Entendido, lo proceso."},
              {"role":"user","content":"Dale, necesito respuesta ya."},
              {"role":"assistant","content":"Lo siento, no puedo por ese limite."},
              {"role":"user","content":"Ok gracias. Paso a paso."},
              {"role":"assistant","content":"Si, empecemos con algo minimo."}
            ]
          }'
          code=$(curl -sS -o /tmp/interaction.json -w "%{http_code}" \
            -X POST "$SAS_BASE_URL/v1/interaction/stability" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $SAS_API_KEY" \
            -d "$payload" || true)
          echo "HTTP $code"
          cat /tmp/interaction.json | jq .
          test "$code" = "200"
          status=$(cat /tmp/interaction.json | jq -r '.status')
          version=$(cat /tmp/interaction.json | jq -r '.model_version')
          req_id=$(cat /tmp/interaction.json | jq -r '.request_id')
          exec_at=$(cat /tmp/interaction.json | jq -r '.executed_at')
          in_hash=$(cat /tmp/interaction.json | jq -r '.input_hash')
          cf=$(cat /tmp/interaction.json | jq -r '.content_fingerprint')
          traj_len=$(cat /tmp/interaction.json | jq '.trajectory | length')
          test "$status" = "completed"
          echo "$version" | grep -q "interaction-stability-v1.2"
          test "$req_id" != "null"
          test "$exec_at" != "null"
          test "$in_hash" != "null"
          test "$cf" != "null"
          test "$traj_len" -ge "1"
          # Verify trajectory fields
          cat /tmp/interaction.json | jq -e '.trajectory[0].omega_t != null'
          cat /tmp/interaction.json | jq -e '.trajectory[0].belief_coherence_chi != null'
          cat /tmp/interaction.json | jq -e '.trajectory[0].interaction_stability_sigma != null'
          cat /tmp/interaction.json | jq -e '.trajectory[0].effective_window != null'
          cat /tmp/interaction.json | jq -e '.trajectory[0].alerts != null'
          cat /tmp/interaction.json | jq -e '.summary.demand_model.phi != null'
          echo "Interaction stability smoke test passed."

      - name: Check interaction stats after POST
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          echo "Waiting briefly for interaction writer flush..."
          sleep 4
          code=$(curl -sS -o /tmp/interaction_stats_after_post.json -w "%{http_code}" "$SAS_BASE_URL/public/interaction/stats?days=7" || true)
          echo "HTTP $code"
          cat /tmp/interaction_stats_after_post.json || true
          test "$code" = "200"
          cat /tmp/interaction_stats_after_post.json | jq .
          status=$(cat /tmp/interaction_stats_after_post.json | jq -r '.status')
          total=$(cat /tmp/interaction_stats_after_post.json | jq -r '.total_analyses')
          test "$status" = "ok"
          test "$total" != "null"
          cat /tmp/interaction_stats_after_post.json | jq -e '.privacy.raw_text_stored == false'
          cat /tmp/interaction_stats_after_post.json | jq -e '.privacy.raw_api_keys_stored == false'
          cat /tmp/interaction_stats_after_post.json | jq -e '.privacy.public_stats_are_aggregated == true'
          echo "Interaction stats smoke check passed with total_analyses=$total."


      - name: Check /v1/interaction/stability POST empty conversation (expect 422)
        if: env.SAS_API_KEY != ''
        run: |
          set -e
          code=$(curl -sS -o /tmp/interaction_422.json -w "%{http_code}" \
            -X POST "$SAS_BASE_URL/v1/interaction/stability" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $SAS_API_KEY" \
            -d '{"conversation":[]}' || true)
          echo "HTTP $code"
          cat /tmp/interaction_422.json | jq . || true
          test "$code" = "422"
          echo "Interaction stability 422 validation check passed."

      - name: Warn if SAS_API_KEY is missing
        if: env.SAS_API_KEY == ''
        run: |
          echo "::warning::SAS_SMOKE_API_KEY secret is missing. Protected endpoint checks were skipped."
